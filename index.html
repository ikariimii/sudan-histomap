  for(const [dx,dy,an] of OFF){const x0=p[0]+(an=='start'?dx:an=='end'?dx-wd:-wd/2),y0=p[1]+dy-9,bb=[x0,y0,x0+wd,y0+11];
   if(!boxes.some(q=>bb[0]<q[2]&&bb[2]>q[0]&&bb[1]<q[3]&&bb[3]>q[1])){boxes.push(bb);t.attr('dx',dx).attr('dy',dy).attr('text-anchor',an).attr('display',null);ok=true;break}}
  if(!ok)t.attr('display','none');d3.select(this).selectAll('title').remove();d3.select(this).append('title').text(d.name);});
 d3.select('#yrl').text(fy(t));d3.selectAll('.band').classed('sel',d=>d===sel);}
function select(d){document.body.classList.remove('nopanel');const t=Math.round((d.start+Math.min(d.end,2026))/2);document.getElementById('yr').value=t;draw(t,d);
 info.innerHTML=`<h3 style="margin:0">${nm(d)}</h3>${AR_ON?'<div dir="ltr" style="font-size:12px">'+d.name+'</div>':''}<i>${sn(d.stream)} · ${fy(d.start)} – ${fy(d.end)}</i>${d.dating_note?' <small dir="ltr" style="unicode-bidi:isolate">('+d.dating_note+')</small>':''}<ul dir="${AR_ON?'rtl':'ltr'}">${EV(d).map(e=>'<li>'+e+'</li>').join('')}</ul><b>${AR_ON?'العواصم/المواقع':'Capitals/sites'}:</b> ${(d.capitals||[]).map(c=>c.name).join(', ')}<br><b>${AR_ON?'المصادر':'Sources'}:</b> <ol dir="ltr" style="margin:4px 0">${(d.sources||[]).map(cite).join('')}</ol>`;}
// Full citations: resolve IDs via a sources table (HISTO.sources or HISTO.meta.sources, keyed by id) if the dataset provides one; otherwise describe the URL.
function cite(src){const T=HISTO.sources||(HISTO.meta&&HISTO.meta.sources)||{},r=(typeof src=='string'&&T[src])||(typeof src=='object'?src:null);
 if(r){const t=[r.author,r.year&&'('+r.year+')',r.title&&'<i>'+r.title+'</i>',r.publisher,r.pages].filter(Boolean).join(' ');return `<li>${t||src}${r.url?` <a href="${r.url}" target="_blank">link</a>`:''}</li>`}
 if(!/^https?:/.test(src))return `<li>${src} <small>(unresolved ID)</small></li>`;
 const u=new URL(src),h=u.hostname.replace(/^www\./,''),last=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||'').replace(/_/g,' ');
 const pub={'en.wikipedia.org':'Wikipedia','wikidata.org':'Wikidata','unesdoc.unesco.org':'UNESCO, General History of Africa (UNESDOC)','whc.unesco.org':'UNESCO World Heritage Centre','kerma.ch':'Swiss-French Archaeological Mission to Kerma'}[h]||h;
 return `<li>${pub}${last?': “'+last+'”':''} — <a href="${src}" target="_blank">${src}</a></li>`}
document.getElementById('yr').oninput=e=>draw(+e.target.value);draw(-700);
if(Q.get('select')){const d=P.find(p=>p.name===Q.get('select'))||P.find(p=>p.name.includes(Q.get('select')));if(d)select(d);}
