 {const W=360,H=380,s=ms.append('svg').attr('width',W).attr('height',H).style('background','#cfe0e8').style('border','1px solid #8a7'),C=E.capitals||[];

  C.forEach(c=>{const p=proj([c.lon,c.lat]);s.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',5).attr('fill','#7c2f2a').attr('stroke','#fff').attr('stroke-width',1.5).append('title').text(c.name);});

  mine.forEach((r,ri)=>{const P2=wps(r).map(w=>({...w,p:proj([w.lon,w.lat])})),col=RC[ri%RC.length],rn=((AR&&r.name_ar)||r.name_en||r.name||r.id)+badge(r);

   P2.forEach(w=>{const ws=srcOf(w).map(i=>V.cite(i).html).join('<br>');s.append('rect').attr('x',w.p[0]-4).attr('y',w.p[1]-4).attr('width',8).attr('height',8).attr('fill',apx(w)?'#fff':col).attr('stroke',col).attr('stroke-width',2)

    if(apx(w)&&w.name){const lab=w.name.replace(/ \(.*\)$/,'')+' '+T('(approx.)','(تقريبي)'),wd=lab.length*5.3;for(const [dx,dy,an] of [[6,-6,'start'],[-6,-6,'end'],[6,12,'start'],[-6,12,'end']]){const x0=w.p[0]+(an=='start'?dx:dx-wd),bb=[x0,w.p[1]+dy-9,x0+wd,w.p[1]+dy+2];
     if(bb[0]<2||bb[2]>W-2||bb[1]<2||bb[3]>H-14)continue;if(!boxes.some(q=>bb[0]<q[2]&&bb[2]>q[0]&&bb[1]<q[3]&&bb[3]>q[1])){boxes.push(bb);s.append('text').attr('x',w.p[0]+dx).attr('y',w.p[1]+dy).attr('text-anchor',an).attr('font-size',9.5).attr('font-style','italic').attr('direction',AR?'rtl':'ltr').attr('fill',col).attr('stroke','#fffaf0').attr('stroke-width',2.5).attr('paint-order','stroke').text(lab);break}}}});
   if(ALG(r)&&P2.length>1){const m=P2[Math.floor(P2.length/2)].p;boxes.push([m[0]-70,m[1]+4,m[0]+70,m[1]+18]);s.append('text').attr('x',m[0]).attr('y',m[1]+16).attr('text-anchor','middle').attr('font-size',11).attr('font-weight','bold').attr('fill','#b3261e').attr('stroke','#fffaf0').attr('stroke-width',3).attr('paint-order','stroke').text(AR?'مزعوم':'ALLEGED'+(DEN(r)?' · '+DEN(r)+' denies':''));}});
  const leg=mine.length?'<b>'+T('Trade routes','طرق التجارة')+':</b><ul style="margin:2px 0;padding-inline-start:18px">'+mine.map((r,ri)=>`<li><span style="display:inline-block;width:18px;border-top:3px solid ${RC[ri%RC.length]};vertical-align:middle"></span> ${(AR&&r.name_ar)||r.name_en||r.name||r.id}${badge(r)} <small dir="ltr">${srcOf(r).map(i=>V.citeText(i)+V.badges(V.srcTable()[i])).join('; ')}</small></li>`).join('')+'</ul>'+(nApx?`<div class="note">${T('Dashed = approximate waypoints (as flagged in the data).','المتقطع = نقاط تقريبية (كما وردت في البيانات).')}</div>`:''):'';

  ms.append('div').attr('class','note').html((C.length?'':flagBox('sites')+' ')+(E['economy'+(AR?'_ar':'_en')]?`<b>${T('Trade/economy','التجارة/الاقتصاد')}:</b> ${E['economy'+(AR?'_ar':'_en')]}`:'')+leg+noteRT);}
 // lens comparison
